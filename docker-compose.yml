services:
  mysql:
    image: mysql:8.4
    container_name: mnm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mybookstore
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/MNM_bookstore.sql:/docker-entrypoint-initdb.d/01-MNM_bookstore.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend/laravel-api
      dockerfile: Dockerfile
    container_name: mnm-backend
    restart: unless-stopped
    env_file:
      - ./backend/laravel-api/.env
    environment:
      APP_URL: http://localhost:8000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: mybookstore
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:10000"

  bookstore-ui:
    image: node:20-alpine
    container_name: mnm-bookstore-ui
    restart: unless-stopped
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      REACT_APP_API_BASE_URL: http://localhost:8000
      REACT_APP_ADMIN_APP_URL: http://localhost:5173
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./Frontend/bookstore-ui:/app
      - bookstore_ui_node_modules:/app/node_modules
    command: sh -c "npm install && npm start"

  bookstore-admin:
    image: node:20-alpine
    container_name: mnm-bookstore-admin
    restart: unless-stopped
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: http://localhost:8000
      VITE_USER_APP_LOGIN_URL: http://localhost:3000/#/login
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend/bookstore-admin:/app
      - bookstore_admin_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  mysql_data:
  bookstore_ui_node_modules:
  bookstore_admin_node_modules:
