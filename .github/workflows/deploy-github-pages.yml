name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "Frontend/bookstore-ui/**"
      - "Frontend/bookstore-admin/**"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Frontend/bookstore-ui/package-lock.json
            Frontend/bookstore-admin/package-lock.json

      - name: Install UI dependencies
        working-directory: Frontend/bookstore-ui
        run: npm ci

      - name: Build UI
        working-directory: Frontend/bookstore-ui
        env:
          REACT_APP_API_BASE_URL: ${{ vars.REACT_APP_API_BASE_URL }}
          REACT_APP_ADMIN_APP_URL: ${{ vars.REACT_APP_ADMIN_APP_URL }}
        run: npm run build

      - name: Install admin dependencies
        working-directory: Frontend/bookstore-admin
        run: npm ci

      - name: Build admin
        working-directory: Frontend/bookstore-admin
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_USER_APP_LOGIN_URL: ${{ vars.VITE_USER_APP_LOGIN_URL }}
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          mkdir -p pages/admin
          cp -R Frontend/bookstore-ui/build/. pages/
          cp -R Frontend/bookstore-admin/dist/. pages/admin/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
